name: Render Korean Short

on:
  workflow_dispatch:
  push:
    paths:
      - "cards.json"
      - "assets/**"
      - "render.py"
      - "requirements.txt"
      - ".github/workflows/render.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install FFmpeg and Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install MeloTTS and project dependencies
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 https://github.com/myshell-ai/MeloTTS.git /tmp/MeloTTS
          python -m pip install -e /tmp/MeloTTS
          python -m unidic download
          python -m pip install -r requirements.txt

      - name: Render MP4
        run: python render.py

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: shorts-video
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7
